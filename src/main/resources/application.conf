# =====================================================
# Akka Configuration
# =====================================================
akka {
  log-config-on-start = on

  actor {
    provider = "local"
    loglevel = "INFO"

    # --- Mailboxes ---
    # اگر در کُد از MailboxSelector.bounded(...) استفاده می‌کنی،
    # همین تعریف کافیه؛ نیازی به deployment نیست.
    mailbox {
      bounded-mailbox {
        mailbox-type = "akka.dispatch.NonBlockingBoundedMailbox"
        mailbox-capacity = 1000
        mailbox-push-timeout-time = 10s
      }
      default-mailbox {
        mailbox-type = "akka.dispatch.UnboundedMailbox"
      }
    }

    # --- Classic Deployment (برای Typed توصیه نمی‌شود) ---
    # ✅ پیشنهاد: این بلوک را حذف/کامنت کن تا با MailboxSelector کُد قاطی نشود.
    # deployment {
    #   /system/slow-target { mailbox = bounded-mailbox }
    #   /scanner1          { mailbox = bounded-mailbox }
    #   /observer1         { mailbox = bounded-mailbox }
    # }
  }
}

# =====================================================
# Custom Dispatchers
# =====================================================
my-dispatcher { type = Dispatcher, executor = "thread-pool-executor"
  thread-pool-executor.fixed-pool-size = 2, throughput = 1 }
worker-dispatcher { type = Dispatcher, executor = "fork-join-executor"
  fork-join-executor { parallelism-min = 8, parallelism-max = 64 }, throughput = 100 }
flooder-dispatcher { type = Dispatcher, executor = "fork-join-executor"
  fork-join-executor { parallelism-min = 2, parallelism-max = 8 }, throughput = 50 }


# =====================================================
# Kamon Configuration
# =====================================================
kamon {
  environment {
    service = "akka-bench"
    host = "localhost"
  }

  metric {
    tick-interval = 1s
    default-settings {
      distribution {
        lowest-discernible-value = 0
        highest-trackable-value  = 10000
        significant-figures      = 2
      }
    }
  }

  instrumentation {
    akka {
      classic { capture-mailbox-size-metrics = on }
      typed {
        capture-mailbox-size-metrics = on
        capture-receive-timings      = on
        ask-pattern-timeout-warning  = on
      }
      actors {
        mailbox-size {
          lowest-discernible-value = 0
          highest-trackable-value  = 10000
          significant-figures      = 2
        }
      }
      filters {
        actors {
          track {
            includes = ["Bench/**"]
            excludes = []
          }
        }
      }
    }
  }

  prometheus {
    start-embedded-http-server = true
    refresh-interval = 10s
    embedded-server {
      hostname = "0.0.0.0"
      port = 9191
    }
  }

  status-page {
    port = 5266
    address = "0.0.0.0"
  }
}


