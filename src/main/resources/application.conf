my-dispatcher {
  type = Dispatcher
  executor = "thread-pool-executor"
  thread-pool-executor {
    fixed-pool-size = 2
  }
  throughput = 1
}

akka {
  loglevel = "DEBUG"
  log-dead-letters = 100
  log-dead-letters-during-shutdown = on
}
akka {
  actor {
    provider = "local"
  }
  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
}

kamon {
  environment {
    service = "akka-app"
    host = "localhost"
  }
  metric {
    tick-interval = 10 seconds
  }
  trace {
    sampler = "always"
  }
}
akka {
  actor {
    provider = "local"
  }

  loglevel = "INFO"

  loggers = ["akka.event.slf4j.Slf4jLogger"]

  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"
}
akka {
  actor {
    provider = "local"
  }

  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  version = "2.8.4"
}

akka {
  actor {
    provider = "local"
    guardian-supervisor-strategy = "akka.actor.DefaultSupervisorStrategy"
  }

  loglevel = "INFO"
  loggers = ["akka.event.slf4j.Slf4jLogger"]
  logging-filter = "akka.event.slf4j.Slf4jLoggingFilter"

  version = "2.8.4"
}


kamon.prometheus {
  embedded-server {
    hostname = "0.0.0.0"
    port = 9191
  }
}
